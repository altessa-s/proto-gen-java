name: Publish

on:
  # Release publishes come via repository_dispatch from altessa-s/proto's
  # proto-publish.yml on tag push. The `push: tags` trigger was deliberately
  # omitted to avoid a duplicate run racing with the dispatch (GitHub Packages
  # returns 409 on the second PUT of the same coordinates). The `push:
  # branches: develop` trigger is safe because it publishes a per-commit
  # SNAPSHOT under unique coordinates.
  push:
    branches: [develop]
  repository_dispatch:
    types: [publish-jar]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3). Leave blank to use git tag or develop SNAPSHOT."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ -n "${DISPATCH_VERSION}" ]]; then
            echo "version=${DISPATCH_VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${REF_TYPE}" == "branch" && "${REF_NAME}" == "develop" ]]; then
            BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
            SHORT_SHA=${GITHUB_SHA:0:7}
            echo "version=${BASE_VERSION}-${SHORT_SHA}-SNAPSHOT" >> "$GITHUB_OUTPUT"
          else
            echo "error: no version source available" >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          PROTO_VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publish
